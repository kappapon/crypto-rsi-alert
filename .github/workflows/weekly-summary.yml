name: Weekly Summary

# schedule อยู่ที่ Cloudflare Worker cron (จันทร์ 00:30 UTC = 07:30 ไทย) — Worker ยิง workflow_dispatch
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (print only, no Telegram)'
        type: boolean
        default: false

concurrency:
  group: weekly-summary
  cancel-in-progress: false

jobs:
  summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Send weekly summary
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          DRY_RUN: ${{ inputs.dry_run == true && '1' || '' }}
        run: python weekly_summary.py
