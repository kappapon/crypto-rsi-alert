name: Add Ticker (webhook)

on:
  repository_dispatch:
    types: [add_ticker]

concurrency:
  # แยก group ต่อเหรียญ — กดหลายเหรียญพร้อมกันได้ (queue เกิดเฉพาะเหรียญเดิม)
  group: add-ticker-${{ github.event.client_payload.symbol }}
  cancel-in-progress: false

jobs:
  add:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Validate payload
        id: payload
        env:
          SYMBOL: ${{ github.event.client_payload.symbol }}
        run: |
          if [[ -z "$SYMBOL" ]]; then
            echo "::error::Missing symbol in client_payload"
            exit 1
          fi
          if [[ ! "$SYMBOL" =~ ^[A-Z0-9_]{2,20}$ ]]; then
            echo "::error::Invalid symbol format: $SYMBOL"
            exit 1
          fi
          echo "symbol=$SYMBOL" >> "$GITHUB_OUTPUT"

      - name: Suggest, add and commit (retry on push race)
        env:
          SYMBOL: ${{ steps.payload.outputs.symbol }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # rebase ของ patch เก่าชน conflict เสมอเมื่อสอง run เพิ่มเหรียญติดกันใน JSON
          # → re-apply บน tip ล่าสุดแทน (suggest เป็น idempotent)
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin main
            git reset --hard origin/main
            python manage_watchlist.py suggest "$SYMBOL" --yes
            git add watchlist.json
            if git diff --staged --quiet; then
              echo "No changes."
              exit 0
            fi
            git commit -m "watchlist: add $SYMBOL via webhook $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            if git push; then
              exit 0
            fi
            # jittered backoff de-syncs concurrent racers so they stop colliding in lockstep
            sleep $((RANDOM % 5 + 1))
            echo "push rejected (attempt $attempt) — retrying on fresh tip"
          done
          echo "::error::push failed after 8 attempts"
          exit 1
