name: Paper Trades Tracker
# schedule ย้ายไปอยู่ Cloudflare Worker cron (GitHub cron โดน throttle 1-3 ชม.) — Worker ยิง workflow_dispatch ตรงเวลาแทน
on:
  workflow_dispatch:

concurrency:
  group: paper-trades
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python track_trades.py
      - name: Commit journal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper_trades.json
          if git diff --staged --quiet; then
            echo "No journal changes."
          else
            git commit -m "chore: paper trades update $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
